replicaCount: 1
image:
  repository: nginx
  tag: "1.27-alpine"
service:
  port: 80
ingress:
  enabled: true
  className: traefik
  host: webapp.local
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 200m, memory: 128Mi }
